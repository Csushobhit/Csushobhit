<svg width="700" height="220" xmlns="http://www.w3.org/2000/svg">

<rect width="700" height="220" fill="#000000"/>

<style>
.line {
font-family: monospace;
font-size: 16px;
fill: #00FFC6;
opacity: 0;
animation: show 8s infinite;
}

.l1 { animation-delay: 0s; }
.l2 { animation-delay: 1s; }
.l3 { animation-delay: 2s; }
.l4 { animation-delay: 3s; }
.l5 { animation-delay: 4s; }
.l6 { animation-delay: 5s; }
.l7 { animation-delay: 6s; }
.l8 { animation-delay: 7s; }

@keyframes show {
0% { opacity: 0; }
10% { opacity: 1; }
90% { opacity: 1; }
100% { opacity: 0; }
}




</style>

<text x="20" y="40" class="line l1">$ whoami</text> <text x="20" y="65" class="line l2">Sushobhit Chattaraj</text>

<text x="20" y="95" class="line l3">$ role</text> <text x="20" y="120" class="line l4">Software Engineer | Java Developer</text>

<text x="20" y="150" class="line l5">$ focus</text> <text x="20" y="175" class="line l6">AI/ML | Java Development | Cybersecurity</text>

<text x="20" y="205" class="line l7">$ status Building cool stuff... <tspan class="cursor">█</tspan></text>

</svg>
