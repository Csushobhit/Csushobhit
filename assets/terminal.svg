<svg width="700" height="220" xmlns="http://www.w3.org/2000/svg">

<rect width="700" height="220" fill="#000000"/>

<style>

.line {
font-family: monospace;
font-size: 16px;
fill: #00FFC6;
opacity: 0;
animation-name: show;
animation-duration: 0.8s;
animation-fill-mode: forwards;
animation-iteration-count: 1;
}

.l1 { animation-delay: 0.5s; }
.l2 { animation-delay: 1.5s; }
.l3 { animation-delay: 2.5s; }
.l4 { animation-delay: 3.5s; }
.l5 { animation-delay: 4.5s; }
.l6 { animation-delay: 5.5s; }
.l7 { animation-delay: 6.5s; }

@keyframes show {
from { opacity: 0; }
to { opacity: 1; }
}

.cursor {
animation: blink 1s infinite;
}

@keyframes blink {
0%,50%,100% {opacity:1;}
25%,75% {opacity:0;}
}

</style>

<text x="20" y="40" class="line l1">$ whoami</text>
<text x="20" y="65" class="line l2">Sushobhit Chattaraj</text>

<text x="20" y="95" class="line l3">$ role</text>
<text x="20" y="120" class="line l4">Software Engineer | Java Developer</text>

<text x="20" y="150" class="line l5">$ focus</text>
<text x="20" y="175" class="line l6">AI/ML | Java Development | Cybersecurity</text>

<text x="20" y="205" class="line l7">
$ status Building cool stuff...
<tspan class="cursor">█</tspan>
</text>

</svg>
