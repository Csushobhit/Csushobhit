name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: csushobhit
          outputs: dist/github-contribution-grid-snake-dark.svg

      - name: Deploy snake
        uses: crazy-max/ghaction-github-pages@v3
        with:
           github_token: ${{ secrets.GITHUB_TOKEN }}
           target_branch: output
           build_dir: dist
